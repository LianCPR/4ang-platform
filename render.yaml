services:
  - type: web
    name: song-backend
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/app.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: song-data
      mountPath: /var/data
      sizeGB: 1
